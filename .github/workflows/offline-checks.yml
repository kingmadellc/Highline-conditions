name: Check observation source
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    name: Offline observation checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 check-delivery.py
      - name: Public file allowlist
        run: |
          python3 - <<'PYCODE'
          import subprocess
          expected={'.gitignore','.github/workflows/observations.yml','.github/workflows/offline-checks.yml','README.md','check-delivery.py','fetch-current.py'}
          tracked=set(subprocess.check_output(['git','ls-files'],text=True).splitlines())
          if tracked!=expected:raise SystemExit('Public source file allowlist differs')
          PYCODE
